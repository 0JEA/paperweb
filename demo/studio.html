<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paperweb — paper studio</title>
<style>
  :root {
    --ground: #131217; --panel: #1a191f; --sunk: #0f0e12;
    --rule: #2e2c36; --rule-2: #3a3843;
    --accent: #c8a06a; --text: #e9e5dd; --dim: #8b867e; --dim-2: #6c6760;
    --rail: 218px; --side: 292px;
    --r: 7px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--text); overflow: hidden;
    font: 400 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--side);
         grid-template-rows: 46px minmax(0, 1fr); height: 100%; }

  /* --- top bar -------------------------------------------------------------- */
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
           padding: 0 12px; border-bottom: 1px solid var(--rule); background: var(--panel); }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .name { color: var(--dim); font-size: 12px; }
  header .sp { margin-left: auto; }
  #say { font-size: 11.5px; color: var(--accent); }

  .btn { padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 12.5px;
         background: rgba(255,255,255,.05); border: 1px solid var(--rule-2); }
  .btn:hover { background: rgba(255,255,255,.09); }
  .btn.primary { color: #e8cb9e; background: rgba(200,160,106,.15);
                 border-color: rgba(200,160,106,.4); font-weight: 500; }
  .btn.primary:hover { background: rgba(200,160,106,.22); }

  /* --- shape rail ----------------------------------------------------------- */
  #rail { background: var(--panel); border-right: 1px solid var(--rule);
          overflow-y: auto; padding-bottom: 20px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 9px 9px 7px;
          position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .tabs button { padding: 5px 0; border-radius: 5px; font-size: 11.5px; cursor: pointer;
                 background: transparent; border: 1px solid transparent; color: var(--dim); }
  .tabs button[aria-selected="true"] { color: var(--text); background: rgba(255,255,255,.06);
                                       border-color: var(--rule-2); }
  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 2px 9px; }
  .swatch { display: block; padding: 0; border: 1px solid var(--rule); border-radius: var(--r);
            background: var(--sunk); cursor: pointer; overflow: hidden; text-align: center; }
  .swatch:hover { border-color: var(--rule-2); }
  .swatch[aria-pressed="true"] { border-color: var(--accent);
                                 box-shadow: 0 0 0 1px rgba(200,160,106,.35); }
  .swatch .thumb { height: 78px; display: grid; place-items: center; padding: 7px;
                   background: #191510; }
  .tw { position: relative; display: flex; flex-direction: column; gap: 13%;
        padding: 15% 13%; isolation: isolate; }
  /* No shared background on `.tw i`: at (0,1,1) it outranks `.tw-lines` at
     (0,1,0) and replaced the rules gradient with a solid block. */
  .tw i { display: block; }
  .tw-bar { height: 9%; min-height: 3px; width: 78%; background: rgba(36, 31, 24, .62); }
  .tw-lines { flex: 1; min-height: 0; background: repeating-linear-gradient(180deg,
              rgba(36, 31, 24, .34) 0 1.5px, transparent 1.5px 6px);
              -webkit-mask-image: linear-gradient(180deg, #000 0 58%, transparent 92%);
              mask-image: linear-gradient(180deg, #000 0 58%, transparent 92%); }
  .swatch .cap { display: block; padding: 4px 4px 5px; font-size: 11px; color: var(--dim);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .swatch[aria-pressed="true"] .cap { color: var(--text); }

  /* --- stage ---------------------------------------------------------------- */
  #stage { overflow: auto; display: grid; place-items: center; padding: 30px;
           background:
             radial-gradient(1100px 620px at 50% -10%, #201a14 0%, rgba(32,26,20,0) 68%),
             #17130f; }
  #stage.light { background: radial-gradient(1100px 620px at 50% -10%, #fbf7ee 0%, rgba(251,247,238,0) 68%), #ece5d7; }
  #piece { width: min(100%, 460px); }
  #piece paper-block { width: 100%; }

  /* --- side panel ----------------------------------------------------------- */
  #side { background: var(--panel); border-left: 1px solid var(--rule); overflow-y: auto; }
  .grp { padding: 11px 13px; border-bottom: 1px solid var(--rule); }
  .grp > h2 { font: 600 11px/1.4 ui-sans-serif, system-ui, sans-serif; text-transform: uppercase;
              letter-spacing: .13em; color: var(--dim-2); margin: 0 0 9px; }

  .f { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px;
       align-items: center; margin-bottom: 7px; }
  .f:last-child { margin-bottom: 0; }
  .f > label { font-size: 11.5px; color: var(--dim); }
  .f.on > label { color: var(--text); }
  .f .val { font: 11px/1 ui-monospace, Menlo, monospace; color: var(--dim-2);
            text-align: right; min-width: 34px; }
  .f .in { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .f input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .f select, .f input[type=text], .f input[type=number] {
    width: 100%; padding: 4px 7px; border-radius: 5px; font-size: 12px;
    border: 1px solid var(--rule-2); background: var(--sunk); }
  .f input[type=color] { width: 30px; height: 22px; padding: 0; cursor: pointer;
                         border: 1px solid var(--rule-2); border-radius: 5px; background: none; }
  .f.dead { opacity: .38; }
  .f.dead input, .f.dead select { pointer-events: none; }

  .seg { display: flex; gap: 3px; }
  .seg button { flex: 1; padding: 5px 0; font-size: 11.5px; cursor: pointer; border-radius: 5px;
                background: var(--sunk); border: 1px solid var(--rule-2); color: var(--dim); }
  .seg button[aria-pressed="true"] { color: #e8cb9e; background: rgba(200,160,106,.16);
                                     border-color: rgba(200,160,106,.4); }

  .t { margin-bottom: 7px; }
  .t label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .t input, .t textarea { width: 100%; padding: 5px 7px; border-radius: 5px; font-size: 12px;
                          border: 1px solid var(--rule-2); background: var(--sunk); resize: vertical; }
  .t textarea { min-height: 52px; line-height: 1.45; }

  .note { font-size: 11px; color: var(--dim-2); line-height: 1.45; margin: 7px 0 0; }
  .reset { margin-left: auto; border: 0; background: none; color: var(--dim-2); cursor: pointer;
           font-size: 11px; padding: 0 1px; }
  .reset:hover { color: var(--accent); }

  @media (max-width: 940px) {
    #app { grid-template-columns: 150px minmax(0, 1fr); grid-template-rows: 46px 42vh minmax(0, 1fr); }
    #side { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--rule); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Paper</h1>
    <span class="name" id="pieceName">Sheet</span>
    <span class="sp"></span>
    <span id="say" role="status"></span>
    <button class="btn" id="bg" title="Preview on a light page">Light</button>
    <button class="btn" id="reset">Reset</button>
    <button class="btn primary" id="insert">Insert</button>
  </header>

  <nav id="rail" aria-label="Paper shapes">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-shapes" aria-selected="true">Shapes</button>
      <button role="tab" id="tab-blocks" aria-selected="false">Components</button>
    </div>
    <div id="grid"></div>
  </nav>

  <main id="stage">
    <div id="piece"></div>
  </main>

  <aside id="side">
    <div class="grp">
      <h2>Paper</h2>
      <div id="g-paper"></div>
    </div>
    <div class="grp">
      <h2>Trim</h2>
      <div class="seg" id="trim" role="group" aria-label="Edge trim"></div>
      <p class="note" id="trimNote"></p>
    </div>
    <div class="grp">
      <h2>Wear</h2>
      <div id="g-wear"></div>
    </div>
    <div class="grp">
      <h2>Type</h2>
      <div id="g-type"></div>
    </div>
    <div class="grp">
      <h2>Text</h2>
      <div id="g-text"></div>
    </div>
  </aside>
</div>

<script type="module">
import { manifest } from '../src/blocks/paper-block.js';
import { CONTROLS, control } from '../src/blocks/controls.js';
import { presetNames, preset as lookupPreset, merge, scan, unscan } from '../src/index.js';

const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const say = (m) => {
  $('#say').textContent = m;
  clearTimeout(say._t);
  say._t = setTimeout(() => { $('#say').textContent = ''; }, 2600);
};

const base = await manifest();
const SHAPES = base.blocks.filter((b) => b.family === 'shapes');
const BLOCKS = base.blocks.filter((b) => b.family !== 'shapes');

// One piece at a time. Everything below edits THIS element and nothing else,
// which is what keeps the panel short enough to fit without scrolling past it.
let piece = null;
let tab = 'shapes';

// --- the shape rail ---------------------------------------------------------
// Thumbnails are live renders, not screenshots: a picker of paper has to show
// the paper. They are deliberately NOT re-rendered as you turn the controls --
// they answer "what shape", and 16 surfaces re-rendering on every slider drag
// would make the one piece you are actually editing stutter.
function renderRail() {
  const grid = $('#grid');
  unscan(grid);
  grid.textContent = '';
  const list = tab === 'shapes' ? SHAPES : BLOCKS;
  for (const b of list) {
    const sw = el('button', 'swatch');
    sw.type = 'button';
    sw.setAttribute('aria-pressed', String(piece?.getAttribute('type') === b.id));
    sw.title = b.note || b.name;
    sw.dataset.id = b.id;

    const thumb = el('div', 'thumb');
    // A thumbnail is NOT a small <paper-block>.
    //
    // The blocks carry their own aspect-ratio and text layout for full size,
    // and squeezing that into a 92x64 box left the element and its canvas
    // disagreeing about how wide they were -- the canvas is what you see, so
    // the swatch rendered a clipped strip. A thumbnail needs one thing the
    // block cannot give cheaply: an exact box. So it is a plain div with the
    // shape's paper on it and abstract rules for type, and the picker owns the
    // geometry outright.
    const box = el('div', 'tw');
    const a = b.aspect || 0.77;
    const BOX_W = 76, BOX_H = 58;   // fits inside the swatch padding
    const w = a >= BOX_W / BOX_H ? BOX_W : BOX_H * a;
    box.style.width = `${Math.round(w)}px`;
    box.style.height = `${Math.round(w / a)}px`;
    box.dataset.paper = '';
    // 'clip', not 'inset'. Inset shrinks the SHEET to make room for the deckle
    // and the shadow inside the box, and at 92x35 the margin eats most of the
    // swatch -- every shape came out the same small square. A thumbnail wants
    // the paper to fill its box, and the swatch supplies the framing, so the
    // cast shadow is dropped rather than budgeted for.
    box.dataset.paperOverhang = 'clip';
    box.dataset.paperParams = JSON.stringify(
      merge(paperOf(b), { shadow: { enabled: false } }));
    box.append(el('i', 'tw-bar'), el('i', 'tw-lines'));
    thumb.appendChild(box);

    sw.append(thumb, el('span', 'cap', b.name));
    sw.addEventListener('click', () => choose(b.id));
    grid.appendChild(sw);
  }
  scan(grid);
}

/** A block's paper, resolved from its preset plus its own diff. */
function paperOf(b) {
  if (!b.paper) return {};
  return merge(b.paper.preset ? lookupPreset(b.paper.preset) || {} : {}, b.paper.params || {});
}

for (const [id, which] of [['#tab-shapes', 'shapes'], ['#tab-blocks', 'blocks']]) {
  $(id).addEventListener('click', () => {
    tab = which;
    $('#tab-shapes').setAttribute('aria-selected', String(which === 'shapes'));
    $('#tab-blocks').setAttribute('aria-selected', String(which === 'blocks'));
    renderRail();
  });
}

// --- the piece ---------------------------------------------------------------
function choose(type) {
  const rec = base.blocks.find((b) => b.id === type);
  const keep = piece ? attrsOf(piece) : {};
  const text = piece ? textOf(piece) : {};

  $('#piece').textContent = '';
  piece = document.createElement('paper-block');
  piece.setAttribute('type', type);
  // Carry the current settings across, so trying a different shape shows YOUR
  // paper in that shape rather than resetting everything you just set.
  for (const [k, v] of Object.entries(keep)) piece.setAttribute(k, v);
  $('#piece').appendChild(piece);
  // Slot text is restored after mount, since the block has to exist first.
  piece.addEventListener('pb-mount', () => {
    for (const [name, value] of Object.entries(text)) {
      if (rec.slots.some((s) => s.name === name)) piece.setSlot(name, value);
    }
    buildText();
  }, { once: true });

  $('#pieceName').textContent = rec.name;
  for (const sw of $('#grid').children) {
    sw.setAttribute('aria-pressed', String(sw.dataset.id === type));
  }
  buildPanel();
}

const attrsOf = (p) => Object.fromEntries([...p.attributes]
  .filter((a) => a.name !== 'type').map((a) => [a.name, a.value]));
const textOf = (p) => Object.fromEntries([...p.querySelectorAll('[slot]')]
  .map((n) => [n.getAttribute('slot'), n.textContent]));

// --- controls ----------------------------------------------------------------
// Grouped by what they are FOR rather than by what they touch underneath: the
// paper, its wear, and the type on it. `edge` is promoted out of the list into
// a segmented control, because three named trims read better as three buttons
// than as a dropdown.
const GROUPS = {
  '#g-paper': ['stock', 'paper', 'duotone', 'lift'],
  '#g-wear': ['age', 'relief', 'folds', 'stain', 'bleed', 'fold-crack'],
  '#g-type': ['font', 'ink', 'type-size'],
};

function buildPanel() {
  for (const [sel, names] of Object.entries(GROUPS)) {
    const host = $(sel);
    host.textContent = '';
    for (const name of names) host.appendChild(field(control(name)));
  }
  buildTrim();
}

function field(c) {
  const rec = base.blocks.find((b) => b.id === piece.getAttribute('type'));
  const dead = (c.needsContent && !rec.hasInk) || (c.css && rec.family !== 'shapes');
  const cur = piece.getAttribute(c.name);

  const row = el('div', 'f' + (dead ? ' dead' : '') + (cur !== null ? ' on' : ''));
  const label = el('label', null, c.label);
  label.htmlFor = `c-${c.name}`;
  label.title = !dead ? (c.help || '')
    : c.css ? 'Only on shapes: this component sets its own type'
            : 'Needs ink: this piece has no printed content to act on';
  row.appendChild(label);

  const wrap = el('div', 'in');
  let input;

  if (c.type === 'range') {
    input = el('input');
    input.type = 'range';
    input.min = c.min; input.max = c.max; input.step = c.step;
    input.value = cur ?? defaultFor(c);
    const val = el('span', 'val', cur === null ? 'auto' : fmt(c, cur));
    input.addEventListener('input', () => {
      piece.setAttribute(c.name, input.value);
      val.textContent = fmt(c, input.value);
      row.classList.add('on');
    });
    wrap.append(input, val);
  } else if (c.type === 'color') {
    input = el('input');
    input.type = 'color';
    input.value = cur || (c.name === 'ink' ? '#241f18' : '#f2e9d6');
    input.addEventListener('input', () => {
      piece.setAttribute(c.name, input.value);
      row.classList.add('on');
    });
    wrap.append(input, el('span', 'val', cur ? cur.replace('#', '') : 'auto'));
  } else {
    input = el('select');
    input.appendChild(new Option('default', ''));
    for (const o of (c.type === 'preset' ? presetNames : c.options)) {
      input.appendChild(new Option(o, o));
    }
    input.value = cur || '';
    input.addEventListener('change', () => {
      if (input.value) piece.setAttribute(c.name, input.value);
      else piece.removeAttribute(c.name);
      row.classList.toggle('on', !!input.value);
    });
    wrap.appendChild(input);
  }

  input.id = `c-${c.name}`;
  if (dead) input.disabled = true;
  row.appendChild(wrap);
  return row;
}

const fmt = (c, v) => `${(+v).toFixed(c.step < 1 ? 2 : 0)}${c.unit === 'deg' ? '°' : ''}`;
const defaultFor = (c) => (c.name === 'type-size' ? 15 : (c.min + c.max) / 2);

// --- trim --------------------------------------------------------------------
const TRIMS = [
  ['', 'As cut', 'However the shape was designed.'],
  ['clean', 'Clean', 'Guillotined. A straight, machine-cut edge.'],
  ['deckle', 'Deckle', 'Hand-made: the pulp feathers out where the mould ended.'],
  ['torn', 'Torn', 'Pulled apart along the fibres, so the edge is fibrous.'],
];
function buildTrim() {
  const host = $('#trim');
  host.textContent = '';
  const cur = piece.getAttribute('edge') || '';
  for (const [value, label, note] of TRIMS) {
    const b = el('button', null, label);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(value === cur));
    b.addEventListener('click', () => {
      if (value) piece.setAttribute('edge', value);
      else piece.removeAttribute('edge');
      buildTrim();
    });
    host.appendChild(b);
  }
  $('#trimNote').textContent = (TRIMS.find(([v]) => v === cur) || TRIMS[0])[2];
}

// --- text --------------------------------------------------------------------
function buildText() {
  const host = $('#g-text');
  host.textContent = '';
  const rec = base.blocks.find((b) => b.id === piece.getAttribute('type'));
  if (!rec.slots.length) {
    host.appendChild(el('p', 'note', 'This piece has no editable text.'));
    return;
  }
  for (const slot of rec.slots) {
    const row = el('div', 't');
    const lab = el('label', null, slot.label);
    lab.htmlFor = `t-${slot.name}`;
    const input = el(slot.multiline ? 'textarea' : 'input');
    input.id = `t-${slot.name}`;
    input.placeholder = 'as designed';
    const existing = piece.querySelector(`[slot="${slot.name}"]`);
    if (existing) input.value = existing.textContent;
    input.addEventListener('input', () => {
      if (input.value.trim()) piece.setSlot(slot.name, input.value);
      else { piece.querySelector(`[slot="${slot.name}"]`)?.remove(); piece.refresh(); }
    });
    row.append(lab, input);
    host.appendChild(row);
  }
}

// --- bar ---------------------------------------------------------------------
$('#bg').addEventListener('click', () => {
  const light = $('#stage').classList.toggle('light');
  $('#bg').textContent = light ? 'Dark' : 'Light';
  save();
});
$('#reset').addEventListener('click', () => {
  for (const a of [...piece.attributes]) if (a.name !== 'type') piece.removeAttribute(a.name);
  piece.querySelectorAll('[slot]').forEach((n) => n.remove());
  piece.refresh();
  buildPanel();
  piece.addEventListener('pb-mount', buildText, { once: true });
  say('back to as designed');
});
// Deliberately inert for now: this is where the piece would be handed to
// whatever is embedding the studio.
$('#insert').addEventListener('click', () => say('Insert is not wired up yet'));

// --- persistence -------------------------------------------------------------
const STORE = 'paperweb-paper-v1';
let saveT = null;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        type: piece.getAttribute('type'), attrs: attrsOf(piece), text: textOf(piece),
        light: $('#stage').classList.contains('light'), tab,
      }));
    } catch { /* private mode */ }
  }, 350);
}
new MutationObserver(save).observe($('#piece'),
  { subtree: true, childList: true, attributes: true, characterData: true });

let restored = null;
try { restored = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { /* ignore */ }

if (restored && base.blocks.some((b) => b.id === restored.type)) {
  tab = restored.tab === 'blocks' ? 'blocks' : 'shapes';
  $('#tab-shapes').setAttribute('aria-selected', String(tab === 'shapes'));
  $('#tab-blocks').setAttribute('aria-selected', String(tab === 'blocks'));
  choose(restored.type);
  for (const [k, v] of Object.entries(restored.attrs || {})) piece.setAttribute(k, v);
  piece.addEventListener('pb-mount', () => {
    for (const [n, v] of Object.entries(restored.text || {})) piece.setSlot(n, v);
    buildText();
  }, { once: true });
  if (restored.light) $('#bg').click();
} else {
  choose(SHAPES[0].id);
}
renderRail();
</script>
</body>
</html>
